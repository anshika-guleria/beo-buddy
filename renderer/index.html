<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>Boo-buddy</title>
  <link rel="stylesheet" href="ghost.css">
</head>
<body>
  <main class="pet mood-cheery" data-character="ghost-1" aria-label="Boo-buddy ghost companion">
    <div class="chat-history" id="chat-history" role="log" aria-label="Recent conversation" aria-live="polite" aria-relevant="additions text"></div>
    <form class="whisper" id="whisper-form">
      <label class="sr-only" for="whisper-input">Whisper to Boo-buddy</label>
      <input id="whisper-input" maxlength="500" placeholder="Whisper a little secret..." autocomplete="off" aria-label="Your whisper">
      <button type="submit" aria-label="Send whisper">↗</button>
      <button class="whisper-close" id="whisper-close" type="button" aria-label="Close whisper box">×</button>
    </form>
    <div class="ghost-wrap" id="ghost-wrap">
      <img class="character-art" id="character-art" src="ghosts/ghost-1.svg" alt="Boo-ddy, a cute Día de los Muertos ghost" draggable="false">
    </div>
    <div class="ghost-shadow" aria-hidden="true"></div>
    <div class="pet-name" id="pet-name">Boo-ddy</div>
    <button class="candle-button" id="candle-button" type="button" aria-expanded="false" aria-controls="shortcut-help" aria-label="Show keyboard shortcuts" title="Show keyboard shortcuts">
      <svg class="candle-art" viewBox="0 0 48 64" aria-hidden="true">
        <ellipse class="candle-glow" cx="24" cy="21" rx="14" ry="17"/>
        <path class="candle-smoke" d="M24 13 C18 8 29 5 23 0 M29 11 C35 6 28 3 33 0"/>
        <path class="candle-flame" d="M24 3 C18 11 19 16 24 18 C30 16 30 10 24 3Z"/>
        <path class="candle-flame-core" d="M24 10 C21 14 22 16 24 17 C26 15 26 13 24 10Z"/>
        <path class="candle-wick" d="M24 17V21"/>
        <path class="candle-body" d="M15 22 Q19 25 23 22 Q27 25 33 22 L32 53 Q24 57 16 53Z"/>
        <path class="candle-drip" d="M15 22 Q19 25 23 22 Q27 25 33 22 L33 28 Q30 31 28 28 L27 25 Q24 28 22 26 Q20 31 17 28Z"/>
        <path class="candle-flower" d="M24 35 C21 31 17 34 20 37 C17 40 21 43 24 40 C27 43 31 40 28 37 C31 34 27 31 24 35Z"/>
        <circle class="candle-flower-center" cx="24" cy="37.5" r="2"/>
        <path class="candle-shine" d="M18 45 L18 50"/>
        <ellipse class="candle-base" cx="24" cy="54" rx="11" ry="3"/>
      </svg>
    </button>
    <div class="shortcut-help" id="shortcut-help" role="status" hidden>
      <h2>Keyboard shortcuts</h2>
      <p>Festival dance lasts 10 seconds.</p>
      <div><kbd>Ctrl/Cmd</kbd> + <kbd>Shift</kbd> + <kbd>G</kbd> <span>Change ghost</span></div>
      <div><kbd>Ctrl/Cmd</kbd> + <kbd>Shift</kbd> + <kbd>M</kbd> <span>Toggle masks</span></div>
      <div><kbd>Ctrl/Cmd</kbd> + <kbd>Shift</kbd> + <kbd>D</kbd> <span>Dance + festive tune</span></div>
    </div>
    <div class="onboarding" id="onboarding" hidden></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
