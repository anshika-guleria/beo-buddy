<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>Boo-buddy</title>
  <link rel="stylesheet" href="ghost.css">
</head>
<body>
  <main class="pet mood-cheery" data-character="ghost-1" aria-label="Boo-buddy ghost companion">
    <div class="chat-history" id="chat-history" role="log" aria-label="Recent conversation" aria-live="polite" aria-relevant="additions text"></div>
    <form class="whisper" id="whisper-form">
      <label class="sr-only" for="whisper-input">Whisper to Boo-buddy</label>
      <input id="whisper-input" maxlength="500" placeholder="Whisper a little secret..." autocomplete="off" aria-label="Your whisper">
      <button type="submit" aria-label="Send whisper">↗</button>
      <button class="whisper-close" id="whisper-close" type="button" aria-label="Close whisper box">×</button>
    </form>
    <div class="ghost-wrap" id="ghost-wrap">
      <img class="character-art" id="character-art" src="ghosts/ghost-1.svg" alt="Boo-ddy, a cute Halloween ghost" draggable="false">
    </div>
    <div class="ghost-shadow" aria-hidden="true"></div>
    <div class="pet-name" id="pet-name">Boo-ddy</div>
    <button class="friend-bow" id="friend-bow" type="button" aria-label="Switch ghost. Current ghost: Boo-ddy">
      <svg class="bow-art" viewBox="0 0 120 90" aria-hidden="true">
        <path class="bow-wing bow-wing-left" d="M54 43C43 29 28 13 5 16c8 7 11 15 8 23 10-1 16 6 13 15 11-2 19 3 20 17l13-18z"/>
        <path class="bow-wing bow-wing-right" d="M66 43c11-14 26-30 49-27-8 7-11 15-8 23-10-1-16 6-13 15-11-2-19 3-20 17L61 53z"/>
        <path class="bow-wing-detail" d="M10 21q20-3 42 23M15 39q15-1 32 13m58-31Q85 18 64 44m41-5q-15-1-32 13"/>
        <path class="bow-wing-stitch" d="M8 19q20-4 44 24m60-24q-20-4-44 24"/>
        <circle class="bow-dot" cx="21" cy="50" r="1.5"/><circle class="bow-dot" cx="31" cy="61" r="1.5"/>
        <circle class="bow-dot" cx="99" cy="50" r="1.5"/><circle class="bow-dot" cx="89" cy="61" r="1.5"/>
        <path class="bow-tail bow-tail-left" d="m43 43 13 4-2 31-15-18z"/>
        <path class="bow-tail bow-tail-right" d="m77 43-13-4 2 35 15-18z"/>
        <path class="bow-knot" d="m60 34-8-9 2 15-12 7 15 4 3-5 3 5 15-4-12-7 2-15z"/>
        <path class="bow-heart" d="M60 34c-3-7-14-5-13 3 1 5 8 10 13 14 5-4 12-9 13-14 1-8-10-10-13-3z"/>
        <path class="bow-gem-facet" d="m51 33 4-3 5 4 5-4 4 3-9 13z"/>
        <path class="bow-heart-shine" d="M53 34q2-3 5-1"/>
      </svg>
    </button>
    <div class="onboarding" id="onboarding" hidden></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
